name: riji
description: "日迹 —— 一个把日记存成 Markdown 文件的本地日记程序。"
publish_to: 'none'

version: 1.3.0

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # front matter 的解析与生成
  yaml: ^3.1.2

  # 跨平台路径拼接
  path: ^1.9.1

  # 刻意不引入 path_provider 等任何**插件**（带原生代码的包）。
  # 原因：Flutter 为插件建符号链接要求 Windows 开启开发者模式，
  # 而开启开发者模式需要管理员权限。我们只需要定位一个默认目录，
  # 用环境变量就够了。零插件的附带好处是项目结构更简单、web 预览更容易。

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # 黄历数据表（约 1.4 MB，2000–2060 年）。
  #
  # 做成资源文件而不是 Dart 源码：两万多行的常量会让每次编译都变慢，
  # 而资源文件是独立文件，不参与编译。读取用 rootBundle，仍然是核心 Flutter，
  # 没有引入任何插件。
  #
  # 由 tool/generate_huangli.py 生成，那个文件头部解释了哪些内容可验证、
  # 哪些不可验证。
  assets:
    - assets/huangli.tsv

    # 「本版更新」弹窗要用的两份文本。
    #
    #   · CHANGELOG.md —— 升级后弹给用户看的内容**直接来自它**，所以没有第二份
    #     「更新摘要」要维护。哪些内容会进弹窗，由该文件开头的约定决定。
    #   · pubspec.yaml —— 程序自己不知道自己是哪个版本，而查版本需要
    #     package_info_plus 这类**插件**（见 docs/开发须知.md §6：带原生实现的包
    #     会让 Windows 构建要开发者模式）。所以把 pubspec 本身打进来读 version
    #     字段：版本号只有一个真相来源，不存在"忘了同步常量"这种静默失效。
    - CHANGELOG.md
    - pubspec.yaml

    # 程序图标（每日提醒用）。
    #
    # 为什么要把图标文件也打进包：Windows 通知的"归属图标"写在注册表的
    # `IconUri` 里，它必须指向磁盘上一个 **.ico/.png 文件**——不能指向 exe。
    # 而程序自己的图标是编进 exe 资源里的，磁盘上没有这个文件，
    # 所以启用提醒时要从这里读出来、写一份到设置目录。
    - windows/runner/resources/app_icon.ico
